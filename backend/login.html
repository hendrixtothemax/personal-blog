<!DOCTYPE html>
<head>
    <title>Login</title>
    <script src="/js/htmx.js"></script>
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>
    <nav class="navbar">
        <span class="navsection">
            <span class="navbar-element"><a href="/">Home</a></span>
            <span class="navbar-element"><a href="/">Blog</a></span>
        </span>
        <span class="navsection" style="margin-left: auto;">
            <span class="navbar-element"><a href="/login">Login</a></span>
        </span>
    </nav>
    <div id="content-body">
        <form id="login-box">
            <h1>Login</h1>
            <div class="login-group">
                <div class="login-col">
                    <label for="email">Email: </label>
                    <label for="password">Password: </label>
                </div>
                <div class="login-col">
                    <input type="email" name="email" id="email" required />
                    <input type="password" name="password" id="password" required />
                    <input class="submit-btn" type="submit" value="Login" />
                </div>
            </div>
        </form>
    </div>
</body>
