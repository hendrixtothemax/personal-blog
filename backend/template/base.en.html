<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>{{block "title" .}}{{end}}</title>
        <script src="/js/htmx.js"></script>
        <link rel="stylesheet" href="/css/index.css">
        <script>
            document.addEventListener("DOMContentLoaded", () => {
            const dates = document.querySelectorAll(".post-date");

            dates.forEach(el => {
                const isoString = el.textContent.trim();
                const date = new Date(isoString);

                // format: Month Day, Year (or change to your preference)
                const formatted = date.toLocaleDateString(undefined, {
                year: "numeric",
                month: "long",
                day: "numeric"
                });

                el.textContent = formatted;
            });
            });
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Zen+Kaku+Gothic+Antique&display=swap" rel="stylesheet">
        <style>
            body {
                font-family: "Google Sans Flex", "Zen Kaku Gothic Antique", serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            }
        </style>

    </head>
    <body>
        {{template "navbar.en.html" .}}
        <main id="content-body">
            {{block "content" .}}{{end}}
        </main>
    </body>
</html>
