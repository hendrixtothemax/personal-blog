<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>{{block "title" .}}{{end}}</title>
        <script src="/js/htmx.js"></script>
        <link rel="stylesheet" href="/css/index.css">
        <script>
            // Wrap your date formatting logic in a named function
            function formatDates() {
                const dates = document.querySelectorAll(".post-date");

                dates.forEach(el => {
                    // Only format if it hasn't been formatted already
                    // You can use a data attribute or check for a specific format
                    if (!el.dataset.formatted) {
                        const isoString = el.textContent.trim();
                        // Basic check to avoid parsing non-date strings or already formatted ones
                        if (isoString && isoString.includes("T") && isoString.includes("Z")) { // Expecting ISO 8601 like "YYYY-MM-DDTHH:MM:SSZ"
                            try {
                                const date = new Date(isoString);

                                // Check if the date parsing was successful and it's a valid date
                                if (!isNaN(date.getTime())) {
                                    // format: Month Day, Year (or change to your preference)
                                    const formatted = date.toLocaleDateString(undefined, {
                                        year: "numeric",
                                        month: "long",
                                        day: "numeric"
                                    });

                                    el.textContent = formatted;
                                    el.dataset.formatted = "true"; // Mark as formatted
                                }
                            } catch (e) {
                                console.error("Error formatting date:", isoString, e);
                            }
                        }
                    }
                });
            }

            document.addEventListener("DOMContentLoaded", () => {
                // Initial run when the page first loads
                formatDates();

                // Listen for HTMX afterSwap events on the document body
                // The 'detail.target' is the element that was updated by HTMX.
                // You might optimize by only searching within detail.target if performance is an issue,
                // but document.querySelectorAll is often fine for small scripts.
                document.body.addEventListener("htmx:afterSwap", () => {
                    formatDates();
                });
            });
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Zen+Kaku+Gothic+Antique&display=swap" rel="stylesheet">
        <style>
            body {
                font-family: "Zen Kaku Gothic Antique", "Google Sans Flex", serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            }
        </style>

    </head>
    <body>
        {{template "navbar.en.html" .}}
        <main id="content-body">
            {{block "content" .}}{{end}}
        </main>
    </body>
</html>
